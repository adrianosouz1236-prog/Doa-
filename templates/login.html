<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Doa+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos.css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">❤️</div>
                <h1>Doa<span>+</span></h1>
                <p>Conectando Doadores e ONGs</p>
            </div>

            <p class="subtitle">Acesse sua conta</p>

            <!-- Mensagens -->
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <!-- Formulário -->
            <form id="login-form">
                <input type="hidden" id="csrf-token" value="">
                <input type="hidden" id="recaptcha-token" value="">

                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope" style="margin-right: 5px;"></i> E-mail</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha"><i class="fas fa-lock" style="margin-right: 5px;"></i> Senha</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="senha" name="senha" required placeholder="Digite sua senha">
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="tipo"><i class="fas fa-user-tag" style="margin-right: 5px;"></i> Tipo de conta</label>
                    <select id="tipo" name="tipo">
                        <option value="doador">🤝 Doador</option>
                        <option value="ong">🏢 ONG</option>
                        <option value="admin">👑 Administrador</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>

            <!-- Links -->
            <div class="links">
                <a href="/recuperar_senha.html" class="forgot-link">
                    <i class="fas fa-key"></i> Esqueceu a senha?
                </a>
            </div>

            <div class="divider">ou</div>

            <div class="register-link">
                Ainda não tem cadastro? <a href="/cadastro.html">Cadastre-se aqui</a>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" style="display: none;">
        <span class="toast-message"></span>
    </div>

    <script src="javascript.js/login.js"></script>
</body>
</html>
