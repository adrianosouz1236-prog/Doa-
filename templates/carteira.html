<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Carteira - Doa+</title>
    <link rel="stylesheet" href="estilos.css/carteira.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <a href="/dashboard_ong.html">❤️ Doa+ ONG</a>
            </div>
            <ul class="nav-menu">
                <li><a href="/dashboard_ong.html" class="nav-link">Dashboard</a></li>
                <li><a href="/carteira.html" class="nav-link active">💰 Carteira</a></li>
            </ul>
            <div class="user-menu">
                <span id="user-name">ONG</span>
                <div class="dropdown-menu">
                    <a href="#" id="logout-btn">Sair</a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="page-header">
                <h1>💰 Minha Carteira</h1>
                <p>Gerencie suas doações financeiras</p>
            </div>

            <div class="saldo-card">
                <div class="saldo-info">
                    <span class="saldo-label">Saldo Disponível</span>
                    <span class="saldo-valor" id="saldo-disponivel">R$ 0,00</span>
                </div>
                <div class="saldo-detalhes">
                    <div class="detalhe-item">
                        <span>Total Recebido</span>
                        <strong id="total-recebido">R$ 0,00</strong>
                    </div>
                    <div class="detalhe-item">
                        <span>Total Sacado</span>
                        <strong id="total-sacado">R$ 0,00</strong>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="abrirModalSaque()">💸 Solicitar Saque</button>
            </div>

            <div class="extrato-card">
                <h2>📋 Extrato</h2>
                <div id="extrato-container">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p>Carregando extrato...</p>
                    </div>
                </div>
            </div>

            <div class="doacoes-card">
                <h2>📦 Doações Recebidas</h2>
                <div id="doacoes-recebidas-container">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p>Carregando doações...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="saque-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="fecharModalSaque()">&times;</span>
            <h3>💸 Solicitar Saque</h3>
            <form id="form-saque">
                <input type="hidden" id="csrf-token" value="">
                <div class="form-group">
                    <label>Valor (R$) *</label>
                    <input type="number" id="valor-saque" min="10" step="0.01" required placeholder="Mínimo R$ 10,00">
                </div>
                <div class="form-group">
                    <label>Conta Bancária *</label>
                    <input type="text" id="conta-bancaria" required placeholder="Banco - Agência - Conta">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Solicitar Saque</button>
            </form>
        </div>
    </div>

    <div id="toast" class="toast" style="display: none;">
        <span class="toast-message"></span>
    </div>

    <script src="javascript.js/carteira.js"></script>
</body>
</html>
